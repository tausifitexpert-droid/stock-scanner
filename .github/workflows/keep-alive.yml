name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 13 * * 1,4'   # Every Monday & Thursday, 1PM UTC
  workflow_dispatch:          # Lets you trigger it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase apex_predictions table
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/apex_predictions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
